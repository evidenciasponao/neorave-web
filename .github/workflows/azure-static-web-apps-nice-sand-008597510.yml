- name: Build And Deploy
  id: builddeploy
  uses: Azure/static-web-apps-deploy@v1
  with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_SAND_008597510 }}
    repo_token: ${{ secrets.GITHUB_TOKEN }}
    action: "upload"

    app_location: "/"
    api_location: ""
    app_build_command: "npm run build"
    output_location: "dist/neoac2dj"
